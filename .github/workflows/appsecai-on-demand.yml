name: Security Scan
on:
  workflow_dispatch:
  jobs:
    scan:
        runs-on: ubuntu-latest
            steps:
                  - uses: actions/checkout@v4
                        - uses: returntocorp/semgrep-action@v1
                                with:
                                          generateSarif: true
                                                  continue-on-error: true
                                                        - uses: appsecai-vulnerability-analysis/github-action@v1
                                                                continue-on-error: true
                                                                
