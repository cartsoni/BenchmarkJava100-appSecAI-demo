name: AppSecAI Scan
on:
  workflow_dispatch:
  jobs:
    security-scan:
        runs-on: ubuntu-latest
            permissions:
                  contents: read
                      steps:
                            - uses: actions/checkout@v4
                                  - name: Run AppSecAI
                                          uses: appsecai-vulnerability-analysis/github-action@v1
                                                  continue-on-error: true
                                                  
